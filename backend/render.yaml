services:
  - type: web
    name: sqlnautica-api
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn sqlnautica.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "your-app-name.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-domain.com"
